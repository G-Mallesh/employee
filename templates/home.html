<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Table</title>
</head>
<body>
    <h4> Student Table</h4>
    <table border="2">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mallesh</td>
                <td>20</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Ramesh</td>
                <td>22</td>
                <td>B</td>
            </tr>
    </table>
</body>
</html>
